<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<title>James's Lift Log</title>
<style>
/* Liquid glass, iOS style: translucent blurred panels over a soft colour backdrop, floating tab bar, SF system font. */
:root{
  --bg:#07080d;
  --surface:rgba(255,255,255,.075);
  --surface-2:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.13);
  --fg:#fff;
  --muted:rgba(235,235,245,.62);
  --accent:#0a84ff;
  --accent-2:#5e5ce6;
  --accent-soft:rgba(10,132,255,.22);
  --danger:#ff453a;
  --body:#2b2e3c;
  --glass-blur:blur(28px) saturate(180%);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.06),0 10px 34px rgba(0,0,0,.28);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--fg)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
#scroll{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 42% at 10% 0%,rgba(10,132,255,.5),transparent 70%),
  radial-gradient(50% 38% at 100% 18%,rgba(191,90,242,.38),transparent 70%),
  radial-gradient(70% 45% at 40% 100%,rgba(48,209,200,.26),transparent 70%),
  radial-gradient(40% 30% at 0% 65%,rgba(255,69,120,.18),transparent 70%),
  var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shared glass surface */
.ex,.pick button,.stats,.cal,.panel,.bodies,.seg,.sel select,.empty,nav .in,.addrow{background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line);box-shadow:var(--glass-shadow)}

#app{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(112px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.01em;margin-bottom:2px}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.05;letter-spacing:-.02em}
h1{font-size:36px}
h2{font-size:22px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .12s,opacity .12s}
.btn-primary{background:linear-gradient(180deg,#3a9bff,#0a84ff);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn-ghost{background:var(--surface-2);color:var(--fg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn-line{border:1px solid var(--line);color:var(--fg)}
.btn-danger{background:rgba(255,69,58,.14);color:var(--danger);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.btn-danger.armed{background:var(--danger);color:#fff}
.btn:active{transform:scale(.97);opacity:.85}

/* home */
.home{min-height:calc(100vh - 240px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.home h1{font-size:clamp(52px,16vw,84px);line-height:1;letter-spacing:-.035em}
.home h1 span{background:linear-gradient(90deg,#64d2ff,#0a84ff 45%,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:#30d158}

/* workout picker */
.pick{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.pick button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;border-radius:24px;padding:20px 22px;transition:transform .12s}
.pick button:active{transform:scale(.98)}
.pick .pname{font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.pick .pmeta{grid-column:1;font-size:14px;color:var(--muted)}
.pick .parrow{grid-row:1/3;grid-column:2;color:var(--accent);font-size:22px}

/* session */
.sess-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:4px 0 20px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#64d2ff,#0a84ff);border-radius:3px;transition:width .3s}
.ex{border-radius:22px}
.ex.is-done{opacity:.72}
.ex-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center}
.tick svg{display:none}
.is-done .tick{background:#30d158;border-color:#30d158}
.is-done .tick svg{display:block}
.ex-t{min-width:0;flex:1}
.ex-name{font-weight:600;font-size:16px}
.is-done .ex-name{color:var(--muted)}
.ex-sub{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);transition:transform .2s}
.is-open .chev{transform:rotate(180deg)}
.ex-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.sets-head,.set{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center}
.sets-head{font-size:12px;font-weight:600;color:var(--muted);padding:0 2px}
.set .n{color:var(--muted);text-align:center;font-size:14px;font-weight:600}
.field{position:relative}
.field input{width:100%;height:46px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:0 44px 0 14px;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.field input:focus{border-color:var(--accent);outline:none}
.field span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.x{height:36px;width:36px;border-radius:50%;color:var(--muted);display:grid;place-items:center;font-size:20px}
.x:active{background:var(--surface-2);color:var(--fg)}
.hint{font-size:13px;color:var(--muted)}
.ex-actions{display:flex;gap:8px;margin-top:4px}
.ex-actions .btn{flex:1}
.sess-foot{display:flex;gap:10px;margin-top:20px}
.sess-foot .btn{flex:1}
.addex{margin-top:12px}
.addex>.btn{width:100%}
.addrow{display:flex;gap:8px;padding:10px;border-radius:24px;align-items:center}
.addrow input{flex:1;min-width:0;height:46px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:0 16px;font-size:16px}
.addrow input:focus{border-color:var(--accent);outline:none}
.addrow .btn{height:46px;padding:0 16px;font-size:15px}

/* days */
.big{display:flex;align-items:baseline;gap:12px;margin:10px 0 4px}
.big .num{font-size:64px;line-height:1;font-weight:700;letter-spacing:-.03em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;overflow:hidden;margin:16px 0 20px}
.stats div{padding:14px 16px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.cal{border-radius:24px;padding:16px}
.cal-h{display:flex;align-items:center;margin-bottom:10px}
.cal-h b{font-size:18px;font-weight:700;flex:1}
.cal-h button{width:38px;height:38px;border-radius:50%;color:var(--accent);font-size:22px}
.cal-h button:active{background:var(--surface-2)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-g .dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-g .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--muted);background:rgba(255,255,255,.04)}
.cal-g .d.on{background:linear-gradient(180deg,#3a9bff,#0a84ff);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(10,132,255,.45)}
.cal-g .d.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal-g .d.blank{background:transparent}
.legend-w{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;margin-top:20px;gap:8px}
.li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:20px;text-align:left;width:100%;background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line);box-shadow:var(--glass-shadow)}
.li:active{background:var(--surface-2)}
.li .dt{font-size:15px;font-weight:600;line-height:1.2}
.li .dt small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.chip{display:inline-block;font-weight:700;font-size:17px}
.li .meta{font-size:13px;color:var(--muted)}

/* empty */
.empty{border-radius:24px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--fg);font-weight:600}

/* progress */
.sel{position:relative;margin:14px 0 18px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:52px;border-radius:18px;padding:0 44px 0 16px;font-weight:600;font-size:17px}
.sel::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.panel{border-radius:24px;padding:16px 16px 10px;margin-bottom:12px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.panel-h b{font-size:15px;font-weight:600}
.panel-h span{font-size:15px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.chart{width:100%;overflow:hidden}
.chart svg{display:block}
.hist{margin-top:8px;border-radius:20px;overflow:hidden;background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line)}
.hist div{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
.hist .num{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;min-width:0}

/* muscles */
.seg{display:inline-flex;border-radius:999px;padding:3px}
.seg button{height:34px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s}
.seg button.on{background:rgba(255,255,255,.2);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-radius:26px;padding:18px 10px 12px}
.bodies figure{margin:0;text-align:center}
.bodies svg{width:100%;max-width:200px;height:auto}
.bodies figcaption{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:14px 0 18px}
.scale i{width:22px;height:10px;border-radius:5px;display:inline-block}
.rank{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line);box-shadow:var(--glass-shadow)}
.rk{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk-n{font-size:14px;font-weight:600;color:var(--muted);padding-top:2px}
.rk:nth-child(-n+3) .rk-n{color:var(--accent)}
.rk-b{min-width:0;display:flex;flex-direction:column;gap:6px}
.rk-t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.rk-t b{font-weight:600}
.rk-t .num{font-size:13px;color:var(--muted)}
.rk-bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:4px}
.rk-w{font-size:12.5px;color:var(--muted)}
/* floating glass tab bar */
nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:32px;pointer-events:auto;background:rgba(30,32,44,.45);box-shadow:var(--glass-shadow),0 14px 40px rgba(0,0,0,.4)}
nav button{height:54px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;transition:background .2s,color .2s}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
/* home */
.home{min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:14px;padding-top:8px}
.home h1{font-size:clamp(40px,12vw,56px);line-height:1.02;margin-bottom:4px}
.card{background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line);box-shadow:var(--glass-shadow);border-radius:24px;padding:16px}
.week-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.week-h b{font-size:17px}
.week-h span{font-size:14px;color:var(--muted)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.wd i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:rgba(255,255,255,.07)}
.wd i.on{color:#fff}
.wd.today span{color:var(--fg)}
.wd.today i{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.home .stats{margin:0}
.next{display:flex;align-items:center;gap:14px;padding:18px 18px 18px 20px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 42%,transparent),rgba(255,255,255,.06) 70%);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line);box-shadow:var(--glass-shadow)}
.next .nname{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.next>div:first-child{flex:1;min-width:0}
.next .btn{flex:none}
.sync{justify-content:center;margin-top:4px}

/* calendar */
.cal-h .tdy{width:auto;height:32px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--fg);margin-right:4px}
.cal-g{gap:6px}
.cal-g .d{aspect-ratio:auto;height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,255,255,.04);color:var(--muted);box-shadow:none;border:0;font-size:15px;font-weight:500}
.cal-g .d b{font-weight:inherit}
.cal-g .d.on{background:rgba(255,255,255,.12);color:var(--fg);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.cal-g .d.picked{background:rgba(10,132,255,.35);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-g .d.today b{color:#fff;background:var(--accent);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.cal-g .d.blank{background:transparent}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.legend-w{display:flex;gap:16px;margin-top:14px;font-size:13px;color:var(--muted);justify-content:center}
.legend-w span{display:flex;align-items:center;gap:6px}
.legend-w i{width:8px;height:8px;border-radius:50%}
.msum{font-size:13px;color:var(--muted);margin:-2px 0 12px}

/* progress */
.pseg{display:flex;margin-bottom:12px}
.pseg .seg{width:100%}
.pseg .seg button{flex:1;padding:0 4px}
.panel{padding:16px 12px 8px}
.panel-h{padding:0 6px}
.panel-h span{font-size:20px;font-weight:700;background:linear-gradient(90deg,#64d2ff,#0a84ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.chart svg{touch-action:pan-y;overflow:visible;cursor:crosshair}
.pr{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;color:#1a1300;background:linear-gradient(180deg,#ffe066,#ffb800);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.stats.three b{background:linear-gradient(180deg,#fff,#b7c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* muscles */
.grad{width:170px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgb(58,62,80),rgb(10,132,255))}
.heat,.heat .eyebrow,.heat .hint,.heat .scale,.heat .bodies figcaption,.heat .rk-w,.heat .rk-t .num,.heat .mm span,.heat .rk-n,.heat .seg button,.heat .msg{color:#fff}
.heat .seg button.on{background:rgba(255,255,255,.22)}
.heat .rk-bar{background:rgba(255,255,255,.08)}
.scale{justify-content:center}
.bodies svg path{transition:fill .3s}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mm div{border-radius:20px;padding:12px 14px;background:var(--surface);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line);box-shadow:var(--glass-shadow)}
.mm span{display:block;font-size:12px;color:var(--muted)}
.mm b{font-size:18px}
.editbtn{height:38px;padding:0 18px;font-size:15px}
.edcard{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.edh{display:flex;align-items:center;justify-content:space-between}
.edh b{font-size:20px;font-weight:700}
.edrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.edadd{display:flex;gap:8px;margin-top:6px}
.edadd input{flex:1;min-width:0;height:44px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:0 16px;font-size:16px}
.edadd input:focus{border-color:var(--accent);outline:none}
.edadd .btn{height:44px;padding:0 18px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="scroll"><div id="app"><div id="view"></div></div></div>
<nav><div class="in" id="tabs"></div></nav>

<script>
(function(){
const WORKOUTS={
  push:{name:"Push",ex:["Incline Dumbbell Press","Chest Flys","Plate Loaded Shoulder Press","Cable Lat Raises","Single Arm Cable Tricep Pushdown","Tricep Extension","Overhead Tricep Extension"]},
  pull:{name:"Pull",ex:["Plate Loaded Row","Lat Pulldown","Cable Reverse Flys","Preacher Curl","Bayesian Curl","Cable Bicep Curl"]},
  legs:{name:"Legs",ex:["Leg Press","Squat Machine","Calf Raises","Leg Curl","Leg Extensions"]}
};
const MUSCLES={chest:"Chest",fdelt:"Front delts",sdelt:"Side delts",rdelt:"Rear delts",tri:"Triceps",bi:"Biceps",lats:"Lats",ubk:"Upper back",quads:"Quads",hams:"Hamstrings",glutes:"Glutes",calves:"Calves"};
const HITS={
  "Incline Dumbbell Press":{chest:1,fdelt:.5,tri:.5},
  "Chest Flys":{chest:1},
  "Plate Loaded Shoulder Press":{fdelt:1,sdelt:.5,tri:.5},
  "Cable Lat Raises":{sdelt:1},
  "Single Arm Cable Tricep Pushdown":{tri:1},
  "Tricep Extension":{tri:1},
  "Overhead Tricep Extension":{tri:1},
  "Plate Loaded Row":{ubk:1,lats:.5,rdelt:.5,bi:.3},

let col=null;const timers={},inflight={},dirty={},pending=new Set();
function persist(id){
  lsSet(LS,S.sessions);

}
async function flush(id,tries){
  if(inflight[id])return;
  inflight[id]=true;dirty[id]=false;
  const s=S.sessions[id];
  try{
    if(s&&hasSets(s))await col.doc(id).set(JSON.parse(JSON.stringify(s)));
    else await col.doc(id).delete();
  }catch(e){
    if(e&&e.code==="unavailable"&&tries<1){inflight[id]=false;dirty[id]=true;setTimeout(()=>flush(id,tries+1),700+Math.random()*700);return}
    S.synced=false;
  }
  inflight[id]=false;
  if(dirty[id])flush(id,0);else pending.delete(id);
}

(async function connect(){

    if(!window.claude||typeof window.claude.use!=="function")return;

    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    col=db.collection("data/users/"+uid);
    let first=true;
    col.onSnapshot(snap=>{
      const next={};
      snap.docs.forEach(d=>{if(d.exists)next[d.id]=JSON.parse(JSON.stringify(d.data()))});
      for(const id in S.sessions){if(pending.has(id)||!hasSets(S.sessions[id]))next[id]=S.sessions[id]}
      for(const id of pending){if(!S.sessions[id])delete next[id]}
      const wasEmpty=first&&snap.empty;
      if(!wasEmpty)S.sessions=next;
      S.synced=true;lsSet(LS,S.sessions);
      if(first){first=false;lsMigrate(wasEmpty)}
      if(S.activeId&&!S.sessions[S.activeId])S.activeId=null;

    },()=>{S.synced=false;col=null;safeRender()});

  <div class="cal"><div class="cal-h"><b>${MON[ref.getMonth()]} ${ref.getFullYear()}</b>${S.calOff?`<button class="tdy" data-act="calnow">Today</button>`:""}<button data-act="cal" data-d="-1" aria-label="Previous month">‹</button><button data-act="cal" data-d="1" aria-label="Next month">›</button></div>
  <div class="msum">${inMonth} gym day${inMonth===1?"":"s"} this month</div>
  <div class="cal-g">${cells}</div><div class="legend-w">${legend}</div></div>
  ${sel}${list}`;
}

const PM=[["top","Weight","kg"],["e1rm","Est. 1RM","kg"],["vol","Volume","kg"],["reps","Reps","reps"]];
function progData(n){
  return logged().slice().reverse().map(([,s])=>{const v=validSets(s.ex[n]);if(!v.length)return null;
    const kg=v.filter(x=>x.kg!=null).map(x=>x.kg);const reps=v.reduce((a,x)=>a+(x.reps||0),0);
    const e1=v.filter(x=>x.kg!=null&&x.reps>0).map(x=>x.kg*(1+x.reps/30));
    const vol=v.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0);
    return {date:s.date,top:kg.length?Math.max(...kg):null,e1rm:e1.length?Math.round(Math.max(...e1)*10)/10:null,vol:vol||null,reps:reps||null,sets:v};}).filter(Boolean);
}
function vProgress(){
  const n=S.progEx;const D=progData(n);
  const cur=new Set(visible().flatMap(k=>WORKOUTS[k].ex));
  const old=new Set(Object.values(WORKOUTS).flatMap(w=>w.ex.concat(w.gone)));Object.values(S.sessions).forEach(x=>Object.keys(x.ex).forEach(e=>old.add(e)));
  const rem=[...old].filter(e=>!cur.has(e)&&progData(e).length);
  const o=e=>`<option ${e===n?"selected":""}>${e}</option>`;
  const opts=visible().map(k=>`<optgroup label="${WORKOUTS[k].name}">${WORKOUTS[k].ex.map(o).join("")}</optgroup>`).join("")+(rem.length?`<optgroup label="Removed">${rem.map(o).join("")}</optgroup>`:"");
  const m=PM.find(x=>x[0]===S.pm)||PM[0];
  let body;
  const pts=D.filter(d=>d[m[0]]!=null);
  if(!D.length){body=`<div class="empty"><b>No sets logged for ${n} yet</b>Each workout you log adds a point to the graphs.</div>`}
  else{
    const vals=pts.map(d=>d[m[0]]);
    const best=vals.length?Math.max(...vals):null;
    const last=vals.length?vals[vals.length-1]:null;
    const delta=vals.length>1?last-vals[0]:null;
    const pct=delta!=null&&vals[0]?Math.round(delta/vals[0]*100):null;
    const bt=Math.max(...D.map(d=>d.top==null?-1:d.top));const prIdx=D.findIndex(d=>d.top===bt&&bt>=0);
    body=`<div class="stats three"><div><b>${best!=null?fmtN(best):"—"}</b><span>Best ${m[2]}</span></div><div><b>${delta==null?"—":(delta>=0?"+":"")+fmtN(Math.round(delta*10)/10)}</b><span>since first</span></div><div><b>${D.length}</b><span>Sessions</span></div></div>
    <div class="panel"><div class="panel-h"><b>${m[1]}</b><span id="pm-val">${last!=null?fmtN(last)+" "+m[2]:""}</span></div><div class="chart" data-chart="1"></div></div>
    <div class="eyebrow" style="margin-top:20px">History</div>
    <div class="hist">${D.map((d,i)=>[d,i]).reverse().map(([d,i])=>`<div><span class="num" style="color:var(--fg)">${fmtShort(d.date)}${i===prIdx?'<span class="pr">PR</span>':""}</span><span class="num">${d.sets.map(x=>fmtN(x.kg)+"×"+fmtN(x.reps)).join("  ")}</span></div>`).join("")}</div>`;
  }
  const seg=`<div class="pseg"><div class="seg">${PM.map(([k,l])=>`<button data-act="pm" data-d="${k}" class="${m[0]===k?"on":""}">${l}</button>`).join("")}</div></div>`;
  return `<div class="eyebrow">Progress</div><h1>Graphs</h1><div class="sel"><select id="prog-ex" aria-label="Exercise">${opts}</select></div>${D.length?seg:""}${body}`;
}
function niceStep(r){if(r<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(r)));const f=r/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function drawChart(el,pts,unit){
  const W=Math.max(240,el.clientWidth),H=230,L=40,R=18,T=22,B=28;
  if(!pts.length){el.innerHTML="";return}
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  if(mn===mx){mn=Math.max(0,mn-(mn?mn*.1:1));mx=mx+(mx?mx*.1:1)}
  const st=niceStep((mx-mn)/3);const lo=Math.max(0,Math.floor(mn/st)*st),hi=Math.ceil(mx/st)*st;
  const t0=pd(pts[0].d).getTime(),t1=pd(pts[pts.length-1].d).getTime();
  const x=d=>t1===t0?L+(W-L-R)/2:L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R);
  const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const FF='font-family="-apple-system,BlinkMacSystemFont,sans-serif"';
  const P=pts.map(p=>({v:p.v,d:p.d,x:x(p.d),y:y(p.v)}));
  let g="";for(let v=lo;v<=hi+1e-9;v+=st){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.1)" stroke-dasharray="3 5"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" ${FF}>${fmtN(v)}</text>`}
  let line="M"+P[0].x.toFixed(1)+" "+P[0].y.toFixed(1);
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],m=((a.x+b.x)/2).toFixed(1);line+=` C${m} ${a.y.toFixed(1)} ${m} ${b.y.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`}
  const lp=P[P.length-1],fp=P[0];
  const area=P.length>1?`<path d="${line} L${lp.x.toFixed(1)} ${H-B} L${fp.x.toFixed(1)} ${H-B} Z" fill="url(#ga)"/>`:"";
  let bi=0;P.forEach((p,i)=>{if(p.v>P[bi].v)bi=i});
  const dots=P.map((p,i)=>i===P.length-1||i===bi?"":`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#0b1020" stroke="#64d2ff" stroke-width="2"/>`).join("");
  const bp=P[bi];
  const best=P.length>1?`<circle cx="${bp.x}" cy="${bp.y}" r="6" fill="#ffd60a" stroke="#fff" stroke-width="2"/><text x="${Math.min(Math.max(bp.x,L+10),W-R-10)}" y="${bp.y-12}" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd60a" ${FF}>${fmtN(bp.v)}</text>`:"";
  const end=`<circle cx="${lp.x}" cy="${lp.y}" r="6" fill="#0a84ff" stroke="#fff" stroke-width="2.5"/>`;
  const xl=`<text x="${t1===t0?fp.x:L}" y="${H-6}" text-anchor="${t1===t0?"middle":"start"}" font-size="11" fill="var(--muted)" ${FF}>${fmtShort(pts[0].d)}</text>`+(t1!==t0?`<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" ${FF}>${fmtShort(pts[pts.length-1].d)}</text>`:"");
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} over time">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".5"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bf5af2"/><stop offset=".5" stop-color="#0a84ff"/><stop offset="1" stop-color="#64d2ff"/></linearGradient></defs>
    ${g}${area}<path d="${line}" fill="none" stroke="url(#gl)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${best}${end}${xl}
    <line id="sl" y1="${T}" y2="${H-B}" stroke="rgba(255,255,255,.5)" stroke-width="1.5" style="opacity:0"/><circle id="sc" r="6" fill="#fff" stroke="#0a84ff" stroke-width="3" style="opacity:0"/></svg>`;
  const svg=el.firstElementChild,sl=svg.querySelector("#sl"),sc=svg.querySelector("#sc"),hv=document.getElementById("pm-val");
  const base=hv?hv.textContent:"";
  const move=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*(W/r.width);let k=0,bd=1e9;P.forEach((p,i)=>{const dd=Math.abs(p.x-px);if(dd<bd){bd=dd;k=i}});const p=P[k];
    sl.setAttribute("x1",p.x);sl.setAttribute("x2",p.x);sc.setAttribute("cx",p.x);sc.setAttribute("cy",p.y);sl.style.opacity=sc.style.opacity=1;
    if(hv)hv.textContent=fmtN(p.v)+" "+unit+" · "+fmtShort(p.d)};
  const out=()=>{sl.style.opacity=sc.style.opacity=0;if(hv)hv.textContent=base};
  svg.addEventListener("pointerdown",move);svg.addEventListener("pointermove",move);
  ["pointerleave","pointerup","pointercancel"].forEach(t=>svg.addEventListener(t,out));
}
function drawCharts(){
  const m=PM.find(x=>x[0]===S.pm)||PM[0];
  const D=progData(S.progEx).filter(d=>d[m[0]]!=null).map(d=>({d:d.date,v:d[m[0]]}));
  document.querySelectorAll("[data-chart]").forEach(el=>drawChart(el,D,m[2]));
}

/* muscles */
const BASE=[58,62,80],ACC=[10,132,255];
const mix=t=>"rgb("+BASE.map((b,k)=>Math.round(b+(ACC[k]-b)*t)).join(",")+")";
const LEVELS=[0,.25,.5,.75,1];
function heatVals(){
  const cut=new Date();cut.setDate(cut.getDate()-(S.heat-1));const c=ymd(cut);
  const v={};Object.keys(MUSCLES).forEach(k=>v[k]=0);
  for(const[,s]of logged()){if(s.date<c)continue;for(const[n,e]of Object.entries(s.ex)){const k=validSets(e).length;if(!k||!HITS[n])continue;for(const[m,f]of Object.entries(HITS[n]))v[m]+=k*f}}
  return v;
}
function lvl(v,max){if(!v||!max)return 0;return Math.max(.12,v/max)}
function lastHit(){
  const r={};for(const[,s]of logged()){for(const[n,e]of Object.entries(s.ex)){if(!validSets(e).length||!HITS[n])continue;for(const[m,f]of Object.entries(HITS[n]))if(f>=.5&&!r[m])r[m]=s.date}}
  return r;
}
/* anatomical figure: left half drawn once, mirrored for the right */
const NEU="var(--body)";
function half(c,side){
  const f=side==="front";
  const P=(d,fill)=>`<path d="${d}" fill="${fill}"/>`;
  return [
    P("M84 70 C76 74 66 78 58 82 L86 80 Z",f?c("ubk"):NEU),
    f?P("M84 71 L99 71 L99 84 C93 82 88 81 86 80 Z",NEU):"",
    P("M56 80 C44 82 37 94 38 112 L44 118 C44 104 48 92 58 84 Z",c("sdelt")),
    P("M58 84 C48 92 44 104 44 118 C52 110 62 102 72 98 C70 88 66 82 58 84 Z",f?c("fdelt"):c("rdelt")),
    f?P("M99 84 L99 124 C88 131 74 128 67 120 C63 112 64 101 72 95 C80 87 90 83 99 84 Z",c("chest"))
     :P("M72 102 C64 118 64 142 72 170 C80 180 90 186 99 190 L99 156 L84 124 C80 112 76 106 72 102 Z",c("lats")),
    f?"":P("M99 56 L99 150 L84 122 C78 106 72 94 62 82 C74 78 86 70 94 58 Z",c("ubk")),
    f?P("M44 122 C39 133 38 151 41 166 C45 172 53 172 56 164 C58 150 56 134 50 123 Z",c("bi"))
     :P("M44 122 C38 134 38 152 42 168 C48 174 56 170 58 162 C60 148 56 132 50 122 Z",c("tri")),
    P("M40 172 C34 188 32 208 34 228 L44 230 C50 211 56 191 56 172 Z",NEU),
    `<ellipse cx="38" cy="242" rx="7" ry="11" fill="${NEU}"/>`,
    f?P("M87 130 L99 130 L99 200 L89 198 C85 180 85 150 87 130 Z",NEU):P("M84 180 C90 187 95 191 99 193 L99 204 C90 204 82 200 76 194 C78 188 80 184 84 180 Z",NEU),
    f?P("M67 124 C74 130 80 132 85 131 C83 160 85 190 87 200 C79 196 72 186 70 170 C68 154 67 138 67 124 Z",NEU):"",
    f?P("M70 200 C80 198 92 202 99 206 L99 214 C90 209 80 206 70 206 Z",NEU)
     :P("M70 204 C64 214 64 234 72 244 C82 252 94 250 99 242 L99 206 C90 204 80 202 70 204 Z",c("glutes")),
    f?P("M70 208 C63 232 62 264 66 296 C71 306 84 308 92 300 C96 276 98 242 96 216 C88 209 78 205 70 208 Z",c("quads"))
     :P("M68 248 C63 268 65 290 71 304 C79 311 90 309 94 300 C98 282 98 262 96 250 C88 255 76 255 68 248 Z",c("hams")),
    f?P("M96 218 C99 244 99 272 95 292 L99 292 L99 216 Z",NEU):"",
    `<ellipse cx="80" cy="310" rx="11" ry="7" fill="${NEU}"/>`,
    f?P("M68 320 C62 342 62 370 68 396 L79 398 C85 372 87 346 83 320 Z",c("calves"))
     :P("M66 320 C58 336 60 362 70 380 C76 386 84 384 88 376 C92 358 92 336 86 320 C80 315 72 315 66 320 Z",c("calves")),
    f?P("M84 320 C88 346 88 372 82 398 L90 398 C94 370 94 342 90 320 Z",NEU):P("M72 384 L87 382 L84 402 L76 402 Z",NEU),
    `<ellipse cx="80" cy="412" rx="12" ry="6" fill="${NEU}"/>`
  ].join("");
}
function figure(c,side){
  const h=half(c,side);
  return `<svg viewBox="20 0 160 424" aria-label="${side==="front"?"Front":"Back"} of body">
    <g stroke="var(--bg)" stroke-width="1.4" stroke-linejoin="round">
      <ellipse cx="100" cy="34" rx="19" ry="24" fill="${NEU}"/>
      <path d="M88 54 L112 54 L116 72 L84 72 Z" fill="${NEU}"/>
      ${h}<g transform="translate(200 0) scale(-1 1)">${h}</g>
    </g></svg>`;
}
function vMuscles(){return `<div class="heat">${vMusclesInner()}</div>`}
function vMusclesInner(){
  const v=heatVals();const max=Math.max(...Object.values(v));
  const c=m=>mix(lvl(v[m],max));
  const seg=(k,opts)=>`<div class="seg">${opts.map(([val,l])=>`<button data-act="${k}" data-d="${val}" class="${String(S[k==="heat"?"heat":"hmode"])===String(val)?"on":""}">${l}</button>`).join("")}</div>`;
  const head=`<div class="eyebrow">Muscle heatmap</div><h1>${S.hmode==="rank"?"Ranking":"What you hit"}</h1>
  <div class="row" style="flex-wrap:wrap;gap:8px;margin:14px 0">${seg("hmode",[["map","What you hit"],["rank","Ranking"]])}${seg("heat",[[7,"7d"],[30,"30d"],[90,"90d"]])}</div>`;
  const none=max?"":`<div class="empty" style="margin-bottom:14px"><b>Nothing logged in the last ${S.heat} days</b>Muscles light up as you log sets.</div>`;
  if(S.hmode==="rank"){
    const lh=lastHit();
    const rows=Object.entries(MUSCLES).sort((a,b)=>v[b[0]]-v[a[0]]||a[1].localeCompare(b[1])).map(([k,nm],i)=>{
      const pct=max?v[k]/max*100:0;const d=lh[k];
      const when=d?(daysAgo(d)===0?"today":daysAgo(d)===1?"yesterday":daysAgo(d)+"d ago"):"never";
      return `<div class="rk"><span class="rk-n num">${i+1}</span><div class="rk-b"><div class="rk-t"><b>${nm}</b><span class="num">${fmtN(Math.round(v[k]*10)/10)} sets</span></div><div class="rk-bar"><i style="width:${pct}%;background:${mix(lvl(v[k],max))}"></i></div><div class="rk-w">Last hit ${when}</div></div></div>`;
    }).join("");
    return head+none+`<div class="rank">${rows}</div><p class="hint" style="margin-top:12px">Most trained at the top. Muscles near the bottom are the ones to catch up on.</p>`;
  }
  const ent=Object.entries(MUSCLES).sort((a,b)=>v[b[0]]-v[a[0]]);
  const mm=max?`<div class="mm"><div><span>Most trained</span><b>${ent[0][1]}</b></div><div><span>Needs work</span><b>${ent[ent.length-1][1]}</b></div></div>`:"";
  return head+mm+`<div class="bodies"><figure>${figure(c,"front")}<figcaption>Front</figcaption></figure><figure>${figure(c,"back")}<figcaption>Back</figcaption></figure></div>
  <div class="scale">Less <i class="grad"></i> More</div>${none}
  <p class="hint">Counts working sets. Secondary muscles get partial credit, e.g. triceps get half a set from incline press.</p>`;
}

/* ---------- render ---------- */
function render(){
  const view=document.getElementById("view");
  let h;
  if(S.view==="home")h=vHome();
  else if(S.view==="train")h=S.activeId&&S.sessions[S.activeId]?vSession():vPick();
  else if(S.view==="days")h=vDays();
  else if(S.view==="progress")h=vProgress();
  else h=vMuscles();
  lsSet(LS+"-open",S.open);
  view.innerHTML=h;
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${S.view===k?"on":""}" ${S.view===k?'aria-current="page"':""}>${IC[k]}${l}</button>`).join("");
  if(S.view==="progress")drawCharts();
}
function go(v){S.view=v;S.armed=false;S.adding=false;S.edit=false;lsSet(LS+"-view",v);render();document.getElementById("scroll").scrollTop=0}
function setActive(id){S.activeId=id;lsSet(LS+"-active",id)}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,n=b.dataset.ex,s=S.sessions[S.activeId];
  if(a!=="del")S.armed=false;
  if(a==="tab")return go(b.dataset.v);
  if(a==="start"){const w=b.dataset.w,id=ymd()+"_"+w;if(!S.sessions[id]){S.sessions[id]={date:ymd(),workout:w,ts:Date.now(),ex:{}};lsSet(LS,S.sessions)}setActive(id);S.open={};S.open[WORKOUTS[w].ex.find(x=>!(S.sessions[id].ex[x]&&S.sessions[id].ex[x].done))||WORKOUTS[w].ex[0]]=true;return go("train")}
  if(a==="open"){setActive(b.dataset.id);S.open={};return go("train")}
  if(a==="finish"){setActive(null);S.open={};return go("days")}
  if(a==="del"){if(!S.armed){S.armed=true;return render()}const id=S.activeId;delete S.sessions[id];persist(id);setActive(null);S.armed=false;return go("train")}
  if(a==="addex"){S.adding=true;render();const el=document.getElementById("newex");if(el)el.focus();return}
  if(a==="addexcancel"){S.adding=false;return render()}
  if(a==="addexgo"&&s){
    const el=document.getElementById("newex");
    const name=addEx(s.workout,el?el.value:"");
    if(!name)return el&&el.focus();
    S.open[name]=true;S.adding=false;return render();
  }
  if(a==="edit"){S.edit=!S.edit;return render()}
  if(a==="exrm"){rmEx(b.dataset.w,n);return render()}
  if(a==="wrm"){WORKOUTS[b.dataset.w].hidden=true;saveCfg();return render()}
  if(a==="exadd"){const el=document.getElementById("exa-"+b.dataset.w);addEx(b.dataset.w,el?el.value:"");render();const e2=document.getElementById("exa-"+b.dataset.w);if(e2)e2.focus();return}
  if(a==="wadd"){const el=document.getElementById("new-w");const k=addWorkout(el?el.value:"");render();const e2=document.getElementById(k?"exa-"+k:"new-w");if(e2)e2.focus();return}
  if(a==="toggle"){S.open[n]=!S.open[n];return render()}
  if(a==="done"&&s){const e=s.ex[n]||(s.ex[n]={sets:[],done:false});e.done=!e.done;if(e.done){S.open[n]=false;const w=WORKOUTS[s.workout].ex;const nx=w.find(x=>!(s.ex[x]&&s.ex[x].done));if(nx&&!validSets(s.ex[nx]).length)S.open[nx]=true}else S.open[n]=true;persist(S.activeId);return render()}
  if(a==="add"&&s){const e=s.ex[n]||(s.ex[n]={sets:[],done:false});e.sets.push({kg:null,reps:null});persist(S.activeId);render();const el=document.getElementById("kg-"+slug(n)+"-"+(e.sets.length-1));if(el)el.focus();return}
  if(a==="rm"&&s){s.ex[n].sets.splice(+b.dataset.i,1);persist(S.activeId);return render()}
  if(a==="day"){S.selDay=S.selDay===b.dataset.d?null:b.dataset.d;return render()}
  if(a==="calnow"){S.calOff=0;return render()}
  if(a==="pm"){S.pm=b.dataset.d;lsSet(LS+"-pm",S.pm);return render()}
  if(a==="cal"){S.calOff+=+b.dataset.d;return render()}
  if(a==="heat"){S.heat=+b.dataset.d;return render()}
  if(a==="hmode"){S.hmode=b.dataset.d;lsSet(LS+"-hmode",S.hmode);return render()}
});
document.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const t=ev.target;if(t.id==="newex"){ev.preventDefault();const b=document.querySelector('[data-act="addexgo"]');if(b)b.click()}else if(t.dataset&&t.dataset.go){ev.preventDefault();const b=t.parentElement.querySelector("[data-act]");if(b)b.click()}});
document.addEventListener("input",ev=>{
  const t=ev.target;if(!t.dataset||!t.dataset.f)return;
  const s=S.sessions[S.activeId];if(!s)return;
  const raw=t.value.replace(",",".").trim();const v=raw===""?null:parseFloat(raw);
  s.ex[t.dataset.ex].sets[+t.dataset.i][t.dataset.f]=Number.isFinite(v)?v:null;
  const sub=document.getElementById("sub-"+slug(t.dataset.ex));if(sub)sub.textContent=exSub(s,t.dataset.ex);
  persist(S.activeId);
});
document.addEventListener("change",ev=>{if(ev.target.id==="prog-ex"){S.progEx=ev.target.value;lsSet(LS+"-prog",S.progEx);render()}});
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==="progress")drawCharts()},150)});
if(!["home","train","days","progress","muscles"].includes(S.view))S.view="home";
render();
})();
